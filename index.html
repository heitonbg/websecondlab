<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main class="app container">
    <h1 class="visually-hidden">Список задач</h1>
    
    <form class="add-form" data-add-form novalidate>
      <div class="input-group">
        <label class="visually-hidden" for="new-task">Новая задача</label>
        <input id="new-task" name="title" type="text" maxlength="200" placeholder="Title..." autocomplete="off" aria-describedby="new-task-error">
        <button class="button button--primary" type="submit" aria-label="Добавить задачу">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
      <p class="add-form__error" id="new-task-error" aria-live="polite"></p>
    </form>

    <ul class="task-list" data-list></ul>
    
    <p class="empty" data-empty hidden>No tasks</p>
    
    <p class="status" data-status aria-live="polite"></p>
  </main>

  <template id="task-template">
    <li class="task" data-id="">
      <div class="task__main">
        <input class="task__check" type="checkbox" id="">
        <label class="task__title" for=""></label>
      </div>
      <div class="task__actions">
        <button class="task__btn task__btn--edit" type="button" data-action="edit" aria-label="Редактировать задачу">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
        <button class="task__btn task__btn--delete" type="button" data-action="delete" aria-label="Удалить задачу">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </li>
  </template>
</body>
</html>
