<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main class="app container">
    
    <!-- Форма добавления -->
    <form class="add-form" data-add-form novalidate>
      <div class="input-group">
        <div class="input-wrapper">
          <label class="visually-hidden" for="new-task">Заголовок задачи</label>
          <input id="new-task" name="title" type="text" maxlength="200" placeholder="Title..." autocomplete="off" required>
          
          <label class="visually-hidden" for="new-task-body">Описание задачи</label>
          <input id="new-task-body" name="body" type="text" maxlength="200" placeholder="About..." autocomplete="off">
          
          <label class="visually-hidden" for="new-task-time">Время задачи</label>
          <input id="new-task-time" name="time" type="time" class="input-time" autocomplete="off">
          
          <p class="add-form__error" id="new-task-error" aria-live="polite"></p>
        </div>
        <button class="button--add" type="submit" aria-label="Добавить задачу">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </form>

    <!-- Список задач -->
    <ul class="task-list" data-list></ul>
    
    <!-- Пустое состояние -->
    <div class="empty" data-empty hidden>
      <p>No tasks</p>
      <div class="empty-line"></div>
    </div>
    
    <p class="status visually-hidden" data-status aria-live="polite"></p>
  </main>

  <!-- Шаблон карточки -->
  <template id="task-template">
    <li class="task" data-id="">
      <div class="task__content">
        <h2 class="task__title"></h2>
        <p class="task__body"></p>
        <p class="task__time"></p> <!-- Сюда будем выводить время -->
      </div>
      
      <div class="task__actions-container">
        <button class="task__menu-btn" type="button" aria-label="Действия с задачей" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        
        <div class="task__menu" hidden>
          <button type="button" data-action="edit" aria-label="Редактировать">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="divider"></span>
          <button type="button" data-action="delete" aria-label="Удалить">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
          <span class="divider"></span>
          <button type="button" data-action="toggle" aria-label="Выполнено">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
      </div>
    </li>
  </template>

  <!-- Модалка УДАЛЕНИЯ -->
  <div class="modal" id="delete-modal" hidden>
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="delete-title">
      <h2 id="delete-title" class="modal__title">Delete this task?</h2>
      <div class="modal__actions">
        <button type="button" class="btn-secondary" data-close-modal>No</button>
        <button type="button" class="btn-primary" id="confirm-delete">Yes</button>
      </div>
    </div>
  </div>

  <!-- Модалка РЕДАКТИРОВАНИЯ -->
  <div class="modal" id="edit-modal" hidden>
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__content modal__content--edit" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <h2 id="edit-title" class="visually-hidden">Редактирование задачи</h2>
      
      <div class="edit-form">
        <input type="text" id="edit-title-input" class="edit-input" placeholder="Mini Input..." maxlength="200" required>
        <textarea id="edit-body-input" class="edit-textarea" placeholder="Max Input..." maxlength="500"></textarea>
        <!-- Добавлено поле времени при редактировании -->
        <input type="time" id="edit-time-input" class="edit-input" style="flex: none;">
      </div>

      <div class="modal__actions modal__actions--bottom">
        <button type="button" class="btn-secondary" data-close-modal>Cancel</button>
        <button type="button" class="btn-primary" id="confirm-edit">Save</button>
      </div>
    </div>
  </div>
</body>
</html>
